[build]
  command = "npm run build"
  publish = "dist"

# Server-side proxy for Gutenberg text (Gutenberg sends no CORS headers).
# Must stay ABOVE the SPA catch-all: Netlify applies the first matching rule.
[[redirects]]
  from = "/api/gutenberg/*"
  to = "https://gutenberg.pglaf.org/:splat"
  status = 200
  force = true

# Security block rules: strictly prevent public probing or downloading of .env, git metadata, and markdown
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tsconfig*.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://gutendex.com https://openlibrary.org https://covers.openlibrary.org https://www.gutenberg.org https://gutenberg.org https://archive.org https://*.archive.org https://en.wikisource.org https://*.wikisource.org https://standardebooks.org; frame-src 'self' https://archive.org https://*.archive.org; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
