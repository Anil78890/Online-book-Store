server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://gutendex.com https://openlibrary.org https://covers.openlibrary.org https://www.gutenberg.org https://gutenberg.org https://corsproxy.io https://api.allorigins.win https://thingproxy.freeboard.io; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Server-side proxy for Gutenberg text (Gutenberg sends no CORS headers).
  # Mirrors the Vite dev proxy and the Netlify redirect.
  resolver 8.8.8.8 1.1.1.1 valid=300s;
  resolver_timeout 5s;

  location /api/gutenberg/ {
    proxy_pass https://www.gutenberg.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.gutenberg.org;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_hide_header Content-Security-Policy;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
