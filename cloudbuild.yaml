steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/blueleaf-books', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/blueleaf-books']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args: ['gcloud', 'run', 'deploy', 'blueleaf-books', '--image', 'gcr.io/$PROJECT_ID/blueleaf-books', '--region', 'asia-south1', '--allow-unauthenticated']